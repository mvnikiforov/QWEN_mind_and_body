# ============================================================
#  nginx-конфиг для сайта «Валерия ПРО|БАЛАНС»
#  Скопируйте на VDS:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/probalance
#  Затем:  sudo ln -s /etc/nginx/sites-available/probalance /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name vash-domen.ru www.vash-domen.ru;   # ← замените на свой домен

    root /var/www/probalance;                       # ← папка с содержимым dist/
    index index.html;

    # Сайт — одностраничное приложение (SPA), маршрутизация через hash (#/admin),
    # поэтому достаточно отдавать index.html для всех путей.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Агрессивное кэширование статики (js/css/изображения имеют hash в имени)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /img/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # index.html не кэшируем, чтобы обновления были видны сразу
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Базовая безопасность заголовков
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}

