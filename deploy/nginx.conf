# /etc/nginx/sites-available/probalance
# sudo ln -s /etc/nginx/sites-available/probalance /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d vash-domen.ru

server {
    listen 80;
    server_name vash-domen.ru www.vash-domen.ru;
    root /var/www/probalance;
    index index.html;

    # SPA / якорные маршруты
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
